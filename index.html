    <!-- Prevent theme flash (dark default) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var isDark = t !== "light";
          // Apply initial background/text colors to match React's dark theme
          if (isDark) {
            document.documentElement.style.backgroundColor = "#0C1014";
            document.documentElement.style.color = "#ffffff";
          } else {
            document.documentElement.style.backgroundColor = "#ffffff";
            document.documentElement.style.color = "#000000";
          }
        } catch (e) {}
      })();
    </script>
